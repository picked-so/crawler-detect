# Publishes to npm when a GitHub release is published (tag v0.1.0 and so on), with provenance.
# No token: npm trusts this workflow (trusted publishing, set on the package's npm settings page).
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx npm@latest publish
